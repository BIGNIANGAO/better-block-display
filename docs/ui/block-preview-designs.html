</style>
<script>
(() => {
  const root = document.getElementById('br-aesthetics');
  const defaults = { scene: '冰霜叠加', total: false, partial: false, details: true };
  const state = { ...defaults };
  const scenes = {
    '冰霜叠加': { before: 13, after: 19, sources: [['冰霜', 4], ['冰霜 · 缆线额外触发', 2]] },
    '回合末减少': { before: 13, after: 9, sources: [['冰霜', 2], ['灼伤 × 3', -6]] },
    '999 上限': { before: 997, after: 999, sources: [['冰霜（实际增加）', 2]] }
  };
  function restore(saved) {
    const next = saved && saved.privateContent && saved.privateContent.blockPreview;
    if (!next || typeof next !== 'object') return;
    if (Object.hasOwn(scenes, next.scene)) state.scene = next.scene;
    for (const key of ['total', 'partial', 'details']) if (typeof next[key] === 'boolean') state[key] = next[key];
  }
  restore(window.openai && window.openai.widgetState);
  function save() {
    if (window.openai && window.openai.setWidgetState) {
      window.openai.setWidgetState({
        modelContent: { scene: state.scene, total: state.total, partial: state.partial },
        privateContent: { blockPreview: { ...state } }
      }).catch(() => {});
    }
  }
  function signed(n) { return (n >= 0 ? '+' : '') + n; }
  function render() {
    const scene = scenes[state.scene] || scenes[defaults.scene];
    const delta = scene.after - scene.before;
    for (const panel of root.querySelectorAll('.sts-scene')) {
      const colors = getComputedStyle(panel);
      const directional = colors.getPropertyValue(delta < 0 ? '--sts-loss' : '--sts-gain');
      for (const node of panel.querySelectorAll('.sts-before, .sts-current-value, .sts-summary-before')) node.textContent = scene.before;
      panel.querySelector('.sts-after').textContent = scene.after;
      panel.querySelector('.sts-net').textContent = signed(delta);
      panel.querySelector('.sts-net').style.color = directional;
      const summary = panel.classList.contains('sts-summary');
      panel.querySelector('.sts-number').textContent = state.total || summary ? scene.after : signed(delta);
      panel.querySelector('.sts-number').style.color = state.total || summary ? colors.getPropertyValue('--sts-text') : directional;
      panel.querySelector('.sts-partial').hidden = !state.partial;
      panel.querySelector('.sts-warning').hidden = !state.partial;
      panel.querySelector('.sts-footnote').hidden = state.scene !== '999 上限';
      panel.querySelector('.sts-tip').hidden = !state.details;
      panel.querySelector('.sts-estimate').setAttribute('aria-expanded', String(state.details));
      const extra = panel.querySelector('.sts-summary-delta');
      if (extra) { extra.textContent = '(' + signed(delta) + ')'; extra.style.color = directional; }
      const sources = panel.querySelector('.sts-sources');
      sources.replaceChildren();
      for (const [name, value] of scene.sources) {
        const row = document.createElement('div'); row.className = 'sts-source';
        const label = document.createElement('span'); label.textContent = name;
        const amount = document.createElement('b'); amount.textContent = signed(value);
        amount.style.color = colors.getPropertyValue(value < 0 ? '--sts-loss' : '--sts-gain');
        row.append(label, amount); sources.append(row);
      }
    }
  }
  render();
  for (const button of root.querySelectorAll('.sts-estimate')) {
    button.addEventListener('click', () => { state.details = !state.details; render(); save(); });
  }
  window.addEventListener('openai:set_globals', event => {
    restore(event.detail && event.detail.globals && event.detail.globals.widgetState); render();
  });
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: () => { render(); save(); } });
    tweak.addSelect(state, 'scene', { label: '示意场景', options: Object.keys(scenes) });
    tweak.addToggle(state, 'total', { label: '显示最终格挡' });
    tweak.addToggle(state, 'partial', { label: '部分预估标记' });
    tweak.addToggle(state, 'details', { label: '展开来源提示' });
  }
})();
</script>
